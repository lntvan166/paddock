<!doctype html>
<!--
  Source for herdr/paddock/preview.png, the card the Herdr gallery shows
  (herdr.dev/mods): landscape, like the window shots beside it. Rendered by
  hand and COMMITTED, like scripts/og-card.html: open this file at exactly
  1600x900 and screenshot the viewport.

  Every picture in it is synthetic: the panel is docs/images/herdr-panel.png
  (the mod reading a fake `paddock status --json` and `paddock --demo`), the
  phone is `paddock --demo` at 440x994, scrolled to one prompt, two finished
  and two working agents (docs/images/09-agents-mixed.png). No live session appears here.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
      body {
        background: radial-gradient(120% 90% at 85% 20%, #1f2026 0%, #131316 55%, #0f0f11 100%);
        color: #ecebe6; font-family: "Ubuntu Sans", "Geist", system-ui, sans-serif;
        display: flex; align-items: center; gap: 56px; padding: 0 72px; box-sizing: border-box;
      }
      .copy { flex: 1; min-width: 0; }
      .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; }
      .brand img { width: 46px; height: 46px; border-radius: 10px; }
      h1 { font-size: 64px; line-height: 1.04; margin: 34px 0 22px; letter-spacing: -1.5px; font-weight: 800; }
      h1 em { font-style: normal; color: #e9a33f; }
      p { font-size: 23px; line-height: 1.45; color: #a9a8a2; margin: 0 0 28px; max-width: 520px; }
      code { font-family: "Ubuntu Sans Mono", monospace; font-size: 19px; color: #ecebe6;
        background: #1c1c20; border: 1px solid #2c2c32; border-radius: 10px; padding: 12px 16px; display: inline-block; }
      .phone { flex: none; width: 330px; height: 745px; border-radius: 44px; background: #26262b;
        padding: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
      .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 34px; display: block; }
      .panel { flex: none; height: 760px; border-radius: 14px; overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px #2c2c32; }
      .panel img { height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../docs/images/logo.png" alt="" />paddock</div>
      <h1>Your agents on your phone, <em>run from Herdr.</em></h1>
      <p>Start the dashboard, publish it on your tailnet or a quick tunnel, pair a phone from the QR, mute notifications. Beside your agents.</p>
      <code>paddock mod install</code>
    </div>
    <div class="phone"><img src="../docs/images/09-agents-mixed.png" alt="" /></div>
    <div class="panel"><img src="../docs/images/herdr-panel.png" alt="" /></div>
  </body>
</html>
