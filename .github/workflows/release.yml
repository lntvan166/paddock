name: release

# Tags only. ci.yml gates pull requests and pushes to main, so a red tree
# cannot be released around by pushing a tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: make check
      - run: make check-clean
      - run: make test

      # A release pipeline must not depend on a test target's internals to have
      # produced the artifacts it ships, so if make test ever stops building the UI,
      # the release still embeds one.
      - name: Build the UI and the embed manifest
        run: |
          bun run build:web
          bun run scripts/gen-embedded.ts

      # One Linux runner builds every target. Bun cross-compiles: this was
      # verified producing genuine Mach-O arm64 and ELF aarch64 binaries from
      # x86_64 Linux, which is why there is no macOS runner here.
      - name: Compile
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          build() {
            bun build --compile --target="$1" \
              --define "process.env.PADDOCK_VERSION=\"$VERSION\"" \
              src/server/index.ts --outfile "out/$2"
          }
          build bun-linux-x64    paddock-linux-x86_64
          build bun-linux-arm64  paddock-linux-aarch64
          build bun-darwin-x64   paddock-macos-x86_64
          build bun-darwin-arm64 paddock-macos-aarch64

      # A released binary that reports 0.0.0-dev is not a cosmetic bug: update.ts
      # REFUSES to update a 0.0.0-dev build by design, so `paddock update` would
      # then decline on every release — the headline feature of this release
      # pipeline, dead, with every test still green. The `--define` above nests
      # quotes inside a shell string, which is exactly the kind of thing that
      # breaks silently, so the stamp is read back off the real artifact.
      - name: Smoke — the compiled binary reports this tag's version
        env:
          PADDOCK_NO_UPDATE_CHECK: "1"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          GOT="$(out/paddock-linux-x86_64 --version)"
          echo "paddock --version -> '$GOT' (expected '$VERSION')"
          if [ "$GOT" != "$VERSION" ]; then
            echo "version stamp mismatch: the --define did not reach the binary" >&2
            exit 1
          fi

      - name: Checksums
        run: cd out && sha256sum paddock-* > SHA256SUMS && cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag out/*
          fi

      # The tap comes LAST. The formula's urls point at the assets attached
      # above, so a tap published any earlier serves a formula whose downloads
      # 404 — and had that upload then failed, one advertising a release that
      # never existed.
      - name: Check out the Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: lntvan166/homebrew-paddock
          # github.token is scoped to THIS repository. Pushing to the tap with
          # it fails 403 at the very end of an otherwise green release, so the
          # tap gets its own fine-grained token, contents:write on that repo
          # and nothing else.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render and push the formula
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p tap/Formula
          bun run scripts/render-formula.ts "$VERSION" out/SHA256SUMS tap/Formula/paddock.rb
          cd tap
          git add Formula/paddock.rb
          # Re-running a tag renders byte-identical output. That is not a
          # failure, but `git commit` with nothing staged exits 1 and would
          # fail the job on a legitimate re-run — so the no-op is named
          # explicitly. Suppressing the exit code instead would hide a real
          # failure here too, which is the thing CLAUDE.md forbids.
          if git diff --cached --quiet; then
            echo "formula already current for $VERSION — nothing to push"
          else
            # A literal identity, not an address: this repository is public and
            # CLAUDE.md forbids committing email addresses. git does not
            # require user.email to be one.
            git -c user.name=paddock-release -c user.email=paddock-release \
              commit -m "paddock $VERSION"
            git push
          fi
